<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFORMERS - Más Allá de lo Que Imaginas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-body">

    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h1>TRANS<span>FORMERS</span></h1>
                <p>Más Allá de lo Que Imaginas</p>
            </header>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="admin o cliente" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div id="mensajeError" class="error-msg"></div>

                <button type="submit" class="btn-primary">Activar Sistema</button>
            </form>

            <footer class="login-footer">
                <p>
                    <strong>Administrador:</strong> <code>admin</code> / <code>12345</code><br>
                    <strong>Cliente:</strong> <code>cliente</code> / <code>autos123</code>
                </p>
            </footer>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
